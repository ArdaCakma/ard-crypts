<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARD Crypts - 2D Dungeon Crawler</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050508;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-header {
            text-align: center;
            padding: 4px 0;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            color: #c084fc;
            text-shadow: 0 0 10px #9333ea;
            letter-spacing: 2px;
        }

        .sub-title {
            margin: 2px 0 0 0;
            color: #9ca3af;
            font-size: 11px;
        }

        #main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 12px;
            width: 98vw;
            max-width: 1100px;
            height: calc(100vh - 45px);
            max-height: 520px;
            padding: 4px;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #game-container {
            flex: 1;
            height: 100%;
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            position: relative;
            background-color: #000;
        }

        #sidebar {
            width: 230px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .card h3 {
            color: #facc15;
            margin-top: 0;
            font-size: 13px;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        .stat-box {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .hearts { color: #ef4444; }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 11px;
            max-height: 160px;
            overflow-y: auto;
        }

        .leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px dashed #1e293b;
        }

        .leaderboard-list li span.name {
            color: #93c5fd;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 110px;
        }

        .leaderboard-list li span.score {
            color: #facc15;
            font-weight: bold;
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.92);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-box {
            background: #0f172a;
            border: 2px solid #ef4444;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
            max-width: 320px;
            width: 85%;
        }

        .modal-box h2 {
            margin-top: 0;
            color: #ef4444;
            font-size: 18px;
        }

        .modal-box input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            text-align: center;
            font-size: 13px;
            outline: none;
        }

        .modal-box button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            #game-header { display: none; }
            #main-wrapper { flex-direction: column; width: 100vw; height: 100vh; max-height: none; padding: 0; gap: 0; }
            #game-container { width: 100vw; height: 70vh; border-radius: 0; border: none; }
            #sidebar { width: 100vw; height: 30vh; flex-direction: row; padding: 4px; background-color: #050508; }
            .card { flex: 1; padding: 6px; }
        }

        @media (max-width: 950px) and (orientation: landscape) {
            #game-header { display: none; }
            #main-wrapper { flex-direction: row; width: 100vw; height: 100vh; max-height: none; padding: 0; gap: 0; }
            #game-container { flex: 1; height: 100vh; border: none; border-radius: 0; }
            #sidebar { width: 200px; height: 100vh; padding: 4px; background-color: #050508; }
        }
    </style>
</head>
<body>

    <div id="game-header">
        <h1>ARD CRYPTS</h1>
        <div class="sub-title">Zaman Daralıyor! Kristalleri Topla ve Kapıya Ulaş!</div>
    </div>

    <div id="main-wrapper">
        <!-- OYUN BİTTİ MODALI -->
        <div id="gameover-modal" class="modal-overlay" style="display: none;">
            <div class="modal-box">
                <h2>OYUN BİTTİ!</h2>
                <p id="gameover-reason" style="font-size: 12px; color: #cbd5e1; margin: 4px 0;"></p>
                <p style="font-size: 14px; font-weight: bold; color: #facc15; margin: 4px 0;">Skor: <span id="gameover-score">0</span></p>

                <input type="text" id="player-name-input" placeholder="İsminizi girin" maxlength="12">
                <button onclick="saveScoreAndRestart()">KAYDET VE TEKRAR OYNA</button>
            </div>
        </div>

        <div id="game-container"></div>

        <div id="sidebar">
            <div class="card">
                <h3>Durum Paneli</h3>
                <div class="stat-box"><span>Can:</span> <span id="ui-health" class="hearts">❤️❤️❤️</span></div>
                <div class="stat-box"><span>Seviye:</span> <span id="ui-level" style="color:#60a5fa;">1</span></div>
                <div class="stat-box"><span>Kristal:</span> <span id="ui-crystals" style="color:#facc15;">0</span></div>
            </div>

            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <h3>En Yüksek Skorlar</h3>
                <ul id="leaderboard" class="leaderboard-list"></ul>
            </div>
        </div>
    </div>

    <script>
        let phaserGame = null;
        let lastScore = 0;

        function updateLeaderboardUI() {
            let scores = JSON.parse(localStorage.getItem('ard_crypts_scores') || '[]');
            let listEl = document.getElementById('leaderboard');
            listEl.innerHTML = '';

            if (scores.length === 0) {
                listEl.innerHTML = '<li style="color:#64748b; justify-content:center;">Henüz skor yok</li>';
                return;
            }

            scores.forEach((entry, idx) => {
                let li = document.createElement('li');
                li.innerHTML = `<span class="name">${idx + 1}. ${entry.name}</span><span class="score">${entry.score}</span>`;
                listEl.appendChild(li);
            });
        }

        function saveScoreAndRestart() {
            let nameInput = document.getElementById('player-name-input');
            let playerName = nameInput.value.trim() || 'Adsız Kahraman';

            let scores = JSON.parse(localStorage.getItem('ard_crypts_scores') || '[]');
            scores.push({ name: playerName, score: lastScore });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 5); // İlk 5 skoru tut

            localStorage.setItem('ard_crypts_scores', JSON.stringify(scores));
            updateLeaderboardUI();

            nameInput.value = '';
            document.getElementById('gameover-modal').style.display = 'none';

            if (phaserGame) {
                let activeScene = phaserGame.scene.getScene('MainScene');
                if (activeScene) {
                    activeScene.scene.restart();
                }
            }
        }

        // --- SYNTHESIZER SES MOTORU ---
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playCollect() {
                this.init();
                let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            },
            playHit() {
                this.init();
                let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            },
            playLevelUp() {
                this.init();
                [300, 400, 500, 700].forEach((freq, i) => {
                    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + (i * 0.07));
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + (i * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (i * 0.07) + 0.09);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + (i * 0.07));
                    osc.stop(this.ctx.currentTime + (i * 0.07) + 0.09);
                });
            },
            playGameOver() {
                this.init();
                let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.5);
            }
        };

        // --- PHASER SAHNESİ ---
        class MainScene extends Phaser.Scene {
            constructor() {
                super({ key: 'MainScene' });
            }

            preload() {
                if (this.textures.exists('bg_dungeon')) return;

                let bgCanvas = this.textures.createCanvas('bg_dungeon', 64, 64);
                let bgCtx = bgCanvas.context;
                bgCtx.fillStyle = '#110c1d'; bgCtx.fillRect(0, 0, 64, 64);
                bgCtx.fillStyle = '#18122b'; bgCtx.fillRect(0, 0, 62, 62);
                bgCtx.fillStyle = '#211738'; bgCtx.fillRect(2, 2, 28, 28); bgCtx.fillRect(34, 34, 28, 28);
                bgCanvas.refresh();

                let pCanvas = this.textures.createCanvas('player_pixel', 28, 28);
                let ctx = pCanvas.context;
                ctx.fillStyle = '#dc2626'; ctx.fillRect(4, 8, 20, 14);
                ctx.fillStyle = '#cbd5e1'; ctx.fillRect(7, 7, 14, 14);
                ctx.fillStyle = '#64748b'; ctx.fillRect(7, 2, 14, 7);
                ctx.fillStyle = '#38bdf8'; ctx.fillRect(9, 4, 10, 2);
                ctx.fillStyle = '#eab308'; ctx.fillRect(4, 10, 4, 10);
                pCanvas.refresh();

                let eCanvas = this.textures.createCanvas('enemy_pixel', 28, 28);
                let eCtx = eCanvas.context;
                eCtx.fillStyle = '#991b1b'; eCtx.fillRect(4, 6, 20, 18);
                eCtx.fillStyle = '#ef4444'; eCtx.fillRect(6, 8, 16, 14);
                eCtx.fillStyle = '#f59e0b'; eCtx.fillRect(2, 2, 4, 6); eCtx.fillRect(22, 2, 4, 6);
                eCtx.fillStyle = '#fef08a'; eCtx.fillRect(7, 10, 4, 4); eCtx.fillRect(17, 10, 4, 4);
                eCtx.fillStyle = '#000000'; eCtx.fillRect(8, 11, 2, 2); eCtx.fillRect(18, 11, 2, 2);
                eCanvas.refresh();

                let wCanvas = this.textures.createCanvas('wall_pixel', 32, 32);
                let wCtx = wCanvas.context;
                wCtx.fillStyle = '#2e1065'; wCtx.fillRect(0, 0, 32, 32);
                wCtx.fillStyle = '#4c1d95'; wCtx.fillRect(2, 2, 28, 28);
                wCtx.fillStyle = '#6d28d9'; wCtx.fillRect(4, 4, 24, 4); wCtx.fillRect(4, 18, 24, 4);
                wCanvas.refresh();

                let cCanvas = this.textures.createCanvas('crystal_pixel', 18, 18);
                let cCtx = cCanvas.context;
                cCtx.fillStyle = '#facc15'; cCtx.fillRect(4, 2, 10, 14);
                cCtx.fillStyle = '#fef08a'; cCtx.fillRect(7, 4, 4, 10);
                cCanvas.refresh();

                let dCanvas = this.textures.createCanvas('door_pixel', 40, 40);
                let dCtx = dCanvas.context;
                dCtx.fillStyle = '#1e3a8a'; dCtx.fillRect(0, 0, 40, 40);
                dCtx.fillStyle = '#3b82f6'; dCtx.fillRect(5, 5, 30, 30);
                dCtx.fillStyle = '#93c5fd'; dCtx.fillRect(12, 12, 16, 16);
                dCanvas.refresh();
            }

            create() {
                this.physics.resume();

                this.isGameOver = false;
                this.isInvulnerable = false;
                this.score = 0;
                this.crystalsCollected = 0;
                this.currentLevel = 1;
                this.health = 3;
                this.timeLeft = 25;

                document.getElementById('ui-level').innerText = this.currentLevel;
                document.getElementById('ui-crystals').innerText = this.crystalsCollected;
                this.updateHeartsUI();

                this.add.tileSprite(400, 250, 800, 500, 'bg_dungeon');

                this.walls = this.physics.add.staticGroup();
                this.buildWalls();

                this.door = this.physics.add.sprite(750, 450, 'door_pixel').setVisible(false);
                this.door.body.enable = false;

                this.player = this.physics.add.sprite(50, 50, 'player_pixel');
                this.player.setCollideWorldBounds(true);
                this.physics.add.collider(this.player, this.walls);

                this.crystals = this.physics.add.group();
                this.spawnCrystals();
                this.physics.add.overlap(this.player, this.crystals, this.collectCrystal, null, this);

                this.enemies = this.physics.add.group();
                this.spawnEnemies(this.currentLevel);
                this.physics.add.collider(this.enemies, this.walls);
                this.physics.add.collider(this.enemies, this.enemies);
                this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);

                this.physics.add.overlap(this.player, this.door, this.passLevel, null, this);

                this.scoreText = this.add.text(20, 15, 'Skor: 0', { fontSize: '20px', fill: '#fff', fontStyle: 'bold' });
                this.timerText = this.add.text(650, 15, 'Süre: 25s', { fontSize: '20px', fill: '#ef4444', fontStyle: 'bold' });

                this.cursors = this.input.keyboard.createCursorKeys();

                this.joystickActive = false;
                this.joystickVector = { x: 0, y: 0 };
                this.JOYSTICK_MAX_RADIUS = 45;
                this.setupVirtualJoystick();

                if (this.gameTimer) this.gameTimer.remove();
                this.gameTimer = this.time.addEvent({
                    delay: 1000,
                    callback: this.updateTimer,
                    callbackScope: this,
                    loop: true
                });
            }

            setupVirtualJoystick() {
                this.input.removeAllListeners();
                this.resetJoystick();

                this.joystickBase = this.add.circle(0, 0, this.JOYSTICK_MAX_RADIUS, 0x8b5cf6, 0.45).setDepth(100).setVisible(false);
                this.joystickThumb = this.add.circle(0, 0, 22, 0xffffff, 0.85).setDepth(101).setVisible(false);

                this.input.on('pointerdown', (pointer) => {
                    if (this.isGameOver) return;
                    this.joystickActive = true;
                    this.joystickBase.setPosition(pointer.x, pointer.y).setVisible(true);
                    this.joystickThumb.setPosition(pointer.x, pointer.y).setVisible(true);
                    this.updateJoystickVector(pointer);
                });

                this.input.on('pointermove', (pointer) => {
                    if (!this.joystickActive || this.isGameOver) return;
                    this.updateJoystickVector(pointer);
                });

                this.input.on('pointerup', () => this.resetJoystick());
                this.input.on('pointerout', () => this.resetJoystick());
            }

            updateJoystickVector(pointer) {
                let dx = pointer.x - this.joystickBase.x;
                let dy = pointer.y - this.joystickBase.y;
                let dist = Math.hypot(dx, dy);

                if (dist > this.JOYSTICK_MAX_RADIUS) {
                    let angle = Math.atan2(dy, dx);
                    this.joystickThumb.x = this.joystickBase.x + Math.cos(angle) * this.JOYSTICK_MAX_RADIUS;
                    this.joystickThumb.y = this.joystickBase.y + Math.sin(angle) * this.JOYSTICK_MAX_RADIUS;
                    this.joystickVector.x = Math.cos(angle);
                    this.joystickVector.y = Math.sin(angle);
                } else {
                    this.joystickThumb.x = pointer.x;
                    this.joystickThumb.y = pointer.y;
                    this.joystickVector.x = dx / this.JOYSTICK_MAX_RADIUS;
                    this.joystickVector.y = dy / this.JOYSTICK_MAX_RADIUS;
                }
            }

            resetJoystick() {
                this.joystickActive = false;
                this.joystickVector = { x: 0, y: 0 };
                if (this.joystickBase) this.joystickBase.setVisible(false);
                if (this.joystickThumb) this.joystickThumb.setVisible(false);
            }

            update() {
                if (this.isGameOver) return;

                let speed = 200;
                let vx = 0;
                let vy = 0;

                if (this.joystickActive) {
                    vx = this.joystickVector.x * speed;
                    vy = this.joystickVector.y * speed;
                }

                if (this.cursors.left.isDown) vx = -speed;
                else if (this.cursors.right.isDown) vx = speed;

                if (this.cursors.up.isDown) vy = -speed;
                else if (this.cursors.down.isDown) vy = speed;

                this.player.setVelocity(vx, vy);

                if (vx < 0) this.player.setFlipX(true);
                else if (vx > 0) this.player.setFlipX(false);
            }

            buildWalls() {
                let layout = [
                    {x: 200, y: 120}, {x: 200, y: 152}, {x: 200, y: 184},
                    {x: 400, y: 260}, {x: 400, y: 292}, {x: 400, y: 324},
                    {x: 600, y: 120}, {x: 600, y: 152}, {x: 600, y: 184}
                ];
                layout.forEach(w => this.walls.create(w.x, w.y, 'wall_pixel'));
            }

            spawnCrystals() {
                let positions = [
                    {x: 120, y: 240}, {x: 300, y: 90}, {x: 500, y: 420},
                    {x: 700, y: 140}, {x: 280, y: 420}
                ];
                positions.forEach(pos => this.crystals.create(pos.x, pos.y, 'crystal_pixel'));
            }

            spawnEnemies(count) {
                this.enemies.clear(true, true);
                for (let i = 0; i < count + 1; i++) {
                    let x = Phaser.Math.Between(220, 650);
                    let y = Phaser.Math.Between(150, 380);
                    let enemy = this.enemies.create(x, y, 'enemy_pixel');

                    enemy.setCollideWorldBounds(true);
                    enemy.setBounce(1, 1);
                    enemy.setFriction(0, 0);

                    let speed = 110 + (count * 15);
                    let vx = (Math.random() < 0.5 ? 1 : -1) * speed;
                    let vy = (Math.random() < 0.5 ? 1 : -1) * speed;
                    enemy.setVelocity(vx, vy);
                }
            }

            collectCrystal(player, crystal) {
                crystal.disableBody(true, true);
                AudioFX.playCollect();

                this.score += 150;
                this.crystalsCollected += 1;
                this.scoreText.setText('Skor: ' + this.score);
                document.getElementById('ui-crystals').innerText = this.crystalsCollected;

                if (this.crystals.countActive(true) === 0) {
                    this.door.setVisible(true);
                    this.door.body.enable = true;
                    this.timerText.setText("PORTAL AÇILDI!");
                }
            }

            hitEnemy(player, enemy) {
                if (this.isInvulnerable || this.isGameOver) return;

                AudioFX.playHit();
                this.health -= 1;
                this.updateHeartsUI();

                if (this.health <= 0) {
                    this.gameOver("Düşmana Yem Oldun!");
                } else {
                    this.isInvulnerable = true;
                    this.player.setAlpha(0.4);
                    this.time.addEvent({
                        delay: 1500,
                        callback: () => {
                            this.isInvulnerable = false;
                            if (this.player && this.player.active) this.player.setAlpha(1);
                        }
                    });
                }
            }

            passLevel() {
                AudioFX.playLevelUp();
                this.currentLevel += 1;
                this.score += 500;
                this.timeLeft = 25 + (this.currentLevel * 2);

                document.getElementById('ui-level').innerText = this.currentLevel;
                this.scoreText.setText('Skor: ' + this.score);

                this.player.setPosition(50, 50);
                this.door.setVisible(false);
                this.door.body.enable = false;

                this.spawnCrystals();
                this.spawnEnemies(this.currentLevel);
            }

            updateTimer() {
                if (this.isGameOver) return;
                this.timeLeft--;
                this.timerText.setText('Süre: ' + this.timeLeft + 's');

                if (this.timeLeft <= 0) this.gameOver("Zaman Tükendi!");
            }

            updateHeartsUI() {
                let heartsStr = "";
                for (let i = 0; i < this.health; i++) heartsStr += "❤️";
                document.getElementById('ui-health').innerText = heartsStr || "💀";
            }

            gameOver(reason) {
                if (this.isGameOver) return;
                this.isGameOver = true;
                this.resetJoystick();

                if (this.gameTimer) this.gameTimer.remove();

                this.physics.pause();
                this.player.setVelocity(0, 0);

                AudioFX.playGameOver();

                lastScore = this.score;
                document.getElementById('gameover-reason').innerText = reason;
                document.getElementById('gameover-score').innerText = this.score;
                document.getElementById('gameover-modal').style.display = 'flex';
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 500,
            parent: 'game-container',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            physics: {
                default: 'arcade',
                arcade: { debug: false }
            },
            scene: MainScene
        };

        window.onload = () => {
            phaserGame = new Phaser.Game(config);
            updateLeaderboardUI();
        };
    </script>
</body>
</html>
